name: Limited-release Chromium smoke (3-minute idle)
on:
  pull_request:
    paths:
      - 'tools/release-browser-smoke.py'
      - '.github/workflows/release-browser-smoke.yml'
      - 'client/**'
      - 'server/**'
      - 'tools/ci-server/**'
      - 'tests/helpers/**'
      - 'css/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-browser-smoke:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ci-fixture.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_only_0000
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run check && npx vite build --mode ci && node tools/check-css-bundle.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Playwright and Chromium (CI only)
        run: |
          python -m pip install playwright==1.65.0
          python -m playwright install --with-deps chromium
      - name: Run isolated local API and real 180-second browser smoke
        shell: bash
        run: |
          set -euo pipefail
          HU_CI_DIST=1 PORT=8001 node tools/online-ci-server.cjs > /tmp/hu-release-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          sleep 3
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8001/index.html
          python tools/release-browser-smoke.py --url http://127.0.0.1:8001 --output release-browser-smoke
      - name: Upload screenshots and browser/network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hu-gioi-limited-release-3min-smoke
          path: release-browser-smoke/
          retention-days: 7
